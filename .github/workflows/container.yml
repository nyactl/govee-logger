name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # The image reports the version from pyproject.toml, so a tag that disagrees would mislabel it.
      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject $v"; exit 1; }

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: govee-logger:ci

      # CI has no Bluetooth, so this covers what a deployment depends on besides
      # the radio: the runtime user, writing the database to a bind mount under a
      # read-only root, and failing cleanly when BlueZ is unreachable.
      - name: Smoke test
        run: |
          docker run --rm govee-logger:ci --version
          docker run --rm --entrypoint id govee-logger:ci | grep -q 'uid=1000(govee)'
          data=$(mktemp -d) && sudo chown 1000:1000 "$data"
          docker run --rm --read-only --cap-drop ALL -v "$data:/data" govee-logger:ci latest
          sudo test -s "$data/readings.db"
          if out=$(docker run --rm --read-only --network none -v "$data:/data" govee-logger:ci scan --seconds 1 2>&1); then
            echo "scan without BlueZ should fail"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q ' ERROR '
          ! echo "$out" | grep -q Traceback

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v4
        if: github.event_name != 'pull_request'

      # Keyless: the signing identity is this workflow, so a deployment can
      # verify the image came from this repository and there is no key to leak.
      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
