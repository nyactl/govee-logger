[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govee-logger"
version = "0.1.0"
description = "Log Govee BLE thermometer/hygrometer readings to SQLite"
requires-python = ">=3.11"
dependencies = ["bleak>=0.22", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
govee-logger = "govee_logger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
